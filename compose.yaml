services:
  mongo:
    image: mongo:7
    volumes: ["mongo_data:/data/db"]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 20
  dealers:
    build: services/dealers
    environment:
      MONGO_URL: mongodb://mongo:27017
      SERVICE_TOKEN: ${SERVICE_TOKEN:?Set SERVICE_TOKEN in .env}
    depends_on:
      mongo: {condition: service_healthy}
  sentiment:
    build: services/sentiment
  web:
    build: .
    ports: ["127.0.0.1:8000:8000"]
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY in .env}
      DJANGO_DEBUG: "1"
      ALLOWED_HOSTS: localhost,127.0.0.1
      DATABASE_PATH: /data/db.sqlite3
      DEALERS_URL: http://dealers:3030
      SENTIMENT_URL: http://sentiment:5050
      SERVICE_TOKEN: ${SERVICE_TOKEN}
    volumes: ["django_data:/data"]
    depends_on: [dealers, sentiment]
volumes:
  mongo_data:
  django_data:
