name: Lint
on: [push, pull_request, workflow_dispatch]
jobs:
  lint-python:
    name: Lint Python Files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install ruff
      - name: Run Linter
        run: ruff check --select E9,F63,F7,F82 server services/sentiment scripts
  lint-javascript:
    name: Lint JavaScript Files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-save --package-lock=false eslint @eslint/js
      - name: Run Linter
        run: npx eslint --no-config-lookup --config eslint.config.mjs server/frontend/src services/dealers/index.js
